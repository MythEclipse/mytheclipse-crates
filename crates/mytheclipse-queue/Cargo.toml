[package]
name = "mytheclipse-queue"
version = "5.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asepharyana/mytheclipse"
homepage = "https://github.com/asepharyana/mytheclipse"
documentation = "https://docs.rs/mytheclipse-queue"
authors = ["asepharyana <superaseph@gmail.com>"]
description = "Job queue abstraction with an in-memory backend, WorkerPool executor, retry/backoff and dead-letter queue."
readme = "README.md"
keywords = ["queue", "job-queue", "background-jobs", "worker-pool", "tokio"]
categories = ["asynchronous", "network-programming"]

[features]
default = ["in-memory"]
# In-process scheduler using tokio mpsc + task spawning.
in-memory = ["dep:tokio"]

[dependencies]
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1.53", features = ["sync", "time", "rt", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "queue"
path = "benches/queue.rs"
harness = false
required-features = ["in-memory"]
