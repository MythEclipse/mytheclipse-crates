[package]
name = "mytheclipse"
version = "5.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asepharyana/mytheclipse"
homepage = "https://github.com/asepharyana/mytheclipse"
documentation = "https://docs.rs/mytheclipse"
authors = ["asepharyana <superaseph@gmail.com>"]
description = "Resource-aware abstractions for async I/O, heavy compute, background queue management, resiliency, traffic control, lifecycle, and observability."
readme = "README.md"
keywords = ["async", "concurrency", "resiliency", "circuit-breaker", "observability"]
categories = ["asynchronous", "concurrency", "rust-patterns"]

[dependencies]
tokio = { version = "1.53", features = ["full"], optional = true }
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }

[features]
default = []
io = ["dep:tokio"]
compute = []
bg = ["dep:tokio"]
resiliency = ["dep:tokio"]
traffic = ["dep:tokio"]
lifecycle = ["dep:tokio"]
observability = ["dep:tokio", "lifecycle"]
full = ["io", "compute", "bg", "resiliency", "traffic", "lifecycle", "observability"]

[[example]]
name = "main"
path = "examples/main.rs"
required-features = ["full"]

[[example]]
name = "high_level"
path = "examples/high_level.rs"
required-features = ["full"]

[[example]]
name = "scaling_demo"
path = "examples/scaling_demo.rs"
required-features = ["full"]

[[test]]
name = "race_stress"
path = "tests/race_stress.rs"
required-features = ["full"]

[[bench]]
name = "primitives"
path = "benches/primitives.rs"
harness = false
required-features = ["full"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]